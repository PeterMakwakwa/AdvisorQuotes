# Included in every location: nginx drops server-level add_header lines in a location that sets its own.
#
# CSP: everything is served from this origin (fonts are bundled, /api is proxied), so 'self' covers scripts, styles,
# fonts and API calls. style-src needs 'unsafe-inline' because Radix and sonner position popovers and toasts with
# inline style attributes; scripts stay strict. Add the trace viewer or an error-monitoring endpoint to connect-src
# if the browser ever sends to them directly.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs where TLS terminates (CloudFront or the load balancer), not on this plain-HTTP container.
